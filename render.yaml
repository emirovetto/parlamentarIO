# Blueprint de Render — parlamentarIO (plan free)
# El servicio web aplica el schema (db push), crea el índice FTS,
# corre el seed idempotente y compila Next.js en cada deploy.

databases:
  - name: parlamentario-db
    plan: free
    databaseName: parlamentario
    user: parlamentario

services:
  - type: web
    name: parlamentario
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parlamentario-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_VERSION
        value: "22"
